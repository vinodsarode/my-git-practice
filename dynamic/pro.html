<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Tutorial Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

.header{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    display:flex;
}

.sidebar{
    width:250px;
    background:#1e293b;
    min-height:100vh;
    padding-top:20px;
    position:sticky;
    top:0;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
    border-bottom:1px solid #334155;
}

.sidebar ul li a:hover{
    background:#2563eb;
}

.content{
    flex:1;
    padding:30px;
}

.unit{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.unit h2{
    color:#2563eb;
    margin-bottom:15px;
}

.unit p,
.unit li{
    line-height:1.8;
}

code{
    background:#f1f5f9;
    padding:2px 5px;
    border-radius:4px;
}
</style>

</head>
<body>

<div class="header">
    <h1>Java Programming Tutorial</h1>
    <p>Complete Java Notes - All Units</p>
</div>

<div class="container">

    <div class="sidebar">
        
    </div>

    <div class="content">

        <div class="unit" id="unit1">
            

            
        </div>

        
     </div>
